name: Tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Smoke tests (gate for deploys)
        run: lua5.1 tests/smoke.lua .
      - name: Full unit tests
        run: lua5.1 tests/run.lua .
