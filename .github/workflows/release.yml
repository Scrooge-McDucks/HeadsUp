name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Gate publishing on the test suite so a tag can never ship a broken build.
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # The packager creates (or updates) a GitHub Release for the tag and
      # uploads the zip as a release asset.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and all tags, so the packager can find the previous
          # tag and build the changelog from the commits in between.
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          # Needed to upload to CurseForge. Add it under the repo's
          # Settings > Secrets and variables > Actions.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
