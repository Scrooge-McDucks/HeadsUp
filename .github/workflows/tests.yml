name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:        # lets release.yml require this before publishing

permissions:
  contents: read    # the suite only needs to check the repo out

jobs:
  test:
    name: Lua test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Smoke tests (must pass before any release)
        run: lua5.1 tests/smoke.lua .

      - name: Full unit tests
        run: lua5.1 tests/run.lua .
